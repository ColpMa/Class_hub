async function enter(uid){

catch(e){await sb.auth.signOut();S.me=null;S.err='Profilo non trovato: contatta l\'amministratore.';return login()}

subscribe();S.view='oggi';render()}

if(!S.me||S.me.must_change_password)return;await LOAD.msgs();const c=$('#chat');if(c&&S.view==='messaggi'){c.innerHTML=chatHTML();c.scrollTop=c.scrollHeight}}).subscribe()}

orario(){
const t=S.tt,cls=S.settings.timetable_class;
const head=`<div class="row" style="margin-bottom:1rem"><h2 style="margin:0">Orario ${esc(cls)}</h2><span class="sp row"><button class="sm" data-act="ttnav" data-id="-1" aria-label="Settimana precedente">‹</button><button class="sm" data-act="ttnav" data-id="0">Oggi</button><button class="sm" data-act="ttnav" data-id="1" aria-label="Settimana successiva">›</button></span></div>`;
if(!t)return head+(S.ttErr?`<div class="empty">Non riesco a leggere l'orario da WebUntis.<br><span class="meta">${esc(S.ttErr)}</span></div>`:'<div class="empty">Caricamento dell\'orario…</div>');
const ws=new Date(t.weekStart+'T12:00:00'),days=[];
for(let i=0;i<6;i++){const d=new Date(ws);d.setDate(ws.getDate()+i);const iso=isoL(d);days.push({i,iso,d,list:t.periods.filter(p=>p.date===iso).sort((a,b)=>a.start.localeCompare(b.start))})}
const D=days.slice(0,days[5].list.length?6:5),todayIso=isoL(new Date());
const slots=[...new Set(t.periods.map(p=>p.start+'-'+p.end))].sort();
if(S.ttDay===null){const k=D.findIndex(x=>x.iso===todayIso);S.ttDay=k>=0?k:0}
const cell=p=>`<div class="ls ${p.state}"><b>${esc(p.subject||'—')}</b><span class="meta">${esc([p.room,p.teacher].filter(Boolean).join(' · '))}</span>${p.state==='cancel'?'<span class="tag">Annullata</span>':p.state==='subst'?'<span class="tag">Supplenza</span>':''}</div>`;
const grid=`<div class="ttg"><table><thead><tr><th></th>${D.map(x=>`<th class="${x.iso===todayIso?'today':''}">${DAYS[x.i]} ${x.d.getDate()}</th>`).join('')}</tr></thead><tbody>${slots.map(s=>{const[a,b]=s.split('-');return `<tr><th>${a}<br><span class="meta">${b}</span></th>${D.map(x=>`<td class="${x.iso===todayIso?'today':''}">${x.list.filter(p=>p.start===a&&p.end===b).map(cell).join('')}</td>`).join('')}</tr>`}).join('')}</tbody></table></div>`;
const day=D[Math.min(S.ttDay,D.length-1)];
const list=`<div class="ttd"><div class="chips">${D.map((x,k)=>`<button data-act="ttday" data-id="${k}" class="${k===S.ttDay?'on':''}">${DAYS[x.i]} ${x.d.getDate()}</button>`).join('')}</div>${day.list.map(p=>`<div class="card lesson"><div class="meta">${p.start}–${p.end}</div>${cell(p)}</div>`).join('')||'<div class="empty">Nessuna lezione in questo giorno.</div>'}</div>`;
return head+(t.periods.length?grid+list:'<div class="empty">Nessuna lezione trovata per questa settimana.</div>')+`<p class="meta">Fonte: WebUntis · aggiornato alle ${hm(t.fetchedAt)}</p>`},

if(t.dataset.act==='tick'){await ACT.tick(t.dataset.id);render()}
if(t.dataset.role){await q(sb.from('profiles').update({role:t.value}).eq('id',t.dataset.role));await Promise.all([LOAD.users(),LOAD.dir(),LOAD.log()]);render()}
if(t.dataset.perm){const[id,k]=t.dataset.perm.split('|');await q(sb.from('permissions').update({[k]:t.checked}).eq('user_id',id));await Promise.all([LOAD.users(),LOAD.log()]);render();const d=document.querySelector(`details[data-u="${id}"]`);if(d)d.open=true}
}catch(x){alert(errMsg(x));render()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;$('#nl').innerHTML=noteList()}});
document.addEventListener('submit',async e=>{const f=e.target;if(!f.dataset.form)return;e.preventDefault();if(S.busy)return;S.busy=true;let r;
try{r=await FORMS[f.dataset.form](f)}catch(x){alert(errMsg(x));r=false}
S.busy=false;if(r!==false)render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.rep){S.rep=null;render()}});
boot();
</script>
</body>
</html>
